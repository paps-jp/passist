<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'; connect-src *" />
    <title>PAssist（ホスト）</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <div id="inputWarn" class="warn hidden">⚠ 入力注入が無効（閲覧のみ）。<code>npm run rebuild</code> で有効化できます。</div>
      <div id="watchBar" class="warn hidden"></div>

      <!-- 手順1: ウィンドウ選択 -->
      <section id="picker" class="picker">
      <div class="picker-head">
        <h2>共有するウィンドウを 1 つ選択</h2>
        <button id="reload" class="ghost">更新</button>
      </div>
      <p class="hint">デスクトップ全体や画面は選択肢に出ません。選んだ 1 ウィンドウだけが相手に表示されます。</p>
      <div id="grid" class="grid"></div>
    </section>

    <!-- 手順2: セッション -->
    <section id="session" class="session hidden">
      <div class="left">
        <h2>このウィンドウを共有中</h2>
        <video id="preview" autoplay playsinline muted></video>
        <button id="back" class="ghost">別のウィンドウを選ぶ</button>
      </div>
      <div class="right">
        <label>共有URL（アカウント不要・このリンクだけで接続）</label>
        <div class="urlrow">
          <input id="url" readonly />
          <button id="copy">コピー</button>
        </div>

        <details class="adv">
          <summary>外部公開（トンネル）の公開URLを指定</summary>
          <p class="hint">cloudflared 等の公開URL（例 https://xxx.trycloudflare.com）を入れて「URLを再発行」。</p>
          <div class="urlrow">
            <input id="publicBase" placeholder="https://xxxx.trycloudflare.com" />
            <button id="reissue" class="ghost">URLを再発行</button>
          </div>
        </details>

        <div class="trust">
          <button id="trustLink" class="ghost">信頼リンクを発行（事前承認）</button>
          <span id="trustManage" class="hint"></span>
        </div>
        <div id="trustLinkRow" class="urlrow hidden">
          <input id="trustUrl" readonly />
          <button id="copyTrust">コピー</button>
        </div>

        <div id="pin" class="pin hidden"></div>

        <div id="request" class="request hidden">
          <p>接続リクエストがあります。許可しますか？</p>
          <label class="chk"><input type="checkbox" id="trustChk" /> この端末を信頼（次回から承認なしで接続）</label>
          <div class="btnrow">
            <button id="approve" class="primary">許可する</button>
            <button id="deny" class="ghost">拒否</button>
          </div>
        </div>

        <div class="statusrow">
          <span id="status" class="status">—</span>
          <button id="end" class="danger">セッション終了</button>
        </div>
      </div>
      </section>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
