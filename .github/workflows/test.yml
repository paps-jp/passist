name: test

# プッシュ/PRごとに「動くか」を確認する軽量CI。
# - 全 JS の構文チェック（node --check）
# - util.js / stats.js のピュア関数を node:test で単体テスト
# - signaling の入出力結合テスト（server/test-signaling.js）
# - 既知脆弱性の audit（continue-on-error: アドバイザリ通知）
# host 側(Electron/Win32 ネイティブ依存)のテストは Win 上での実機検証が必要なため、
# ここでは構文と純JSロジックだけを対象にする。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            host/package-lock.json

      # server は本番依存だけインストール（ws/express）。host は重い+ネイティブ依存があるため省略。
      - name: Install server deps (npm ci)
        run: npm ci
        working-directory: server

      - name: Syntax check (server + browser viewer + host JS)
        run: |
          set -e
          for f in $(find server host -name "*.js" \
              -not -path "*/node_modules/*" \
              -not -path "*/dist/*"); do
            node --check "$f"
          done

      # util / stats の純粋関数を node 標準テストランナーで（追加依存なし）
      - name: Unit tests (node --test)
        run: node --test test-util.js test-stats.js test-audit.js
        working-directory: server

      # signaling は外部プロセスとして起動 → test-signaling.js が WebSocket で接続して結合検証
      - name: Start signaling for integration test
        run: |
          PORT=8990 ACCESS_MODE=approve node server.js &
          echo "SIGNAL_PID=$!" >> $GITHUB_ENV
          # サーバ起動を待つ（最大 5 秒）
          for i in 1 2 3 4 5; do
            if (echo > /dev/tcp/127.0.0.1/8990) >/dev/null 2>&1; then break; fi
            sleep 1
          done
        working-directory: server
        shell: bash

      - name: Integration test (test-signaling.js)
        run: TEST_PORT=8990 node test-signaling.js
        working-directory: server

      - name: Stop signaling
        if: always()
        run: kill ${SIGNAL_PID} 2>/dev/null || true
        shell: bash

      - name: npm audit (server, production only)
        run: npm audit --omit=dev --audit-level=high
        working-directory: server
        continue-on-error: true
