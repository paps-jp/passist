name: test

# プッシュ/PRごとに「動くか」を確認する軽量CI。
# - 全 JS の構文チェック（node --check）
# - signaling の入出力テスト（server/test-signaling.js）
# - 既知脆弱性の audit（continue-on-error: アドバイザリ通知）
# host 側(Electron/Win32 ネイティブ依存)のテストは Win 上での実機検証が必要なため、
# ここでは構文と純JSロジックだけを対象にする。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-signaling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            host/package-lock.json

      # server は本番依存だけインストール（ws/express）。host は重い+ネイティブ依存があるため省略。
      - name: Install server deps (npm ci)
        run: npm ci
        working-directory: server

      - name: Syntax check (server + browser viewer + host JS)
        run: |
          set -e
          for f in $(find server host -name "*.js" \
              -not -path "*/node_modules/*" \
              -not -path "*/dist/*"); do
            node --check "$f"
          done

      - name: Signaling self-test (in-process)
        run: node test-signaling.js
        working-directory: server

      - name: npm audit (server, production only)
        run: npm audit --omit=dev --audit-level=high
        working-directory: server
        continue-on-error: true
