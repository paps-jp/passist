name: passist-turn

# 新規 TURN サーバ専用の最小構成。
# 起動すると 60 秒ごとに signaling (passist.paps.jp) へ自分の URL と派生鍵を POST し、
# signaling 側のレジストリに登録される。5 分 heartbeat が途絶えると自動除外。
#
# 必須 env (.env を用意):
#   TURN_URL                 例: turn:turn2.paps.jp:3478
#   THIS_TURN_AUTH_SECRET    signaling 上で HMAC-SHA256(MASTER, TURN_URL) を計算した派生鍵
#   EXTERNAL_IP              この VPS のグローバル IPv4
#   REALM                    既定: paps.jp
# 任意:
#   SIGNALING_URL            既定: https://passist.paps.jp
#   BUDGET_BPS               この TURN が引き受ける帯域上限（既定 4000000）

services:
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/turnserver.conf:ro

  # signaling へ60秒ごとに「自分は生きている」を通知するサイドカー。
  # curl 一発、起動失敗してもループで自動再試行。
  heartbeat:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      SIGNALING_URL: ${SIGNALING_URL:-https://passist.paps.jp}
      TURN_URL: ${TURN_URL}
      THIS_TURN_AUTH_SECRET: ${THIS_TURN_AUTH_SECRET}
      BUDGET_BPS: ${BUDGET_BPS:-4000000}
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null
        while :; do
          curl -fsS -X POST "$$SIGNALING_URL/admin/turn-register" \
            -H 'Content-Type: application/json' \
            -d "{\"url\":\"$$TURN_URL\",\"secret\":\"$$THIS_TURN_AUTH_SECRET\",\"budgetBps\":$$BUDGET_BPS}" \
            >/dev/null 2>&1 \
            && echo "[heartbeat] OK $$TURN_URL" \
            || echo "[heartbeat] FAILED $$TURN_URL"
          sleep 60
        done
