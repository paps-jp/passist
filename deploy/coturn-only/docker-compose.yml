name: passist-turn

# 新規 TURN サーバ専用の最小構成。
# 使い方:
#   1) このVPSにDocker(+composeプラグイン)を入れる
#   2) ufw でポート開放: 3478/tcp,udp / 5349/tcp,udp / 49152-65535/udp
#   3) git clone <repo> && cd deploy/coturn-only
#   4) cp .env.example .env  # TURN_URL, THIS_TURN_AUTH_SECRET, EXTERNAL_IP を埋める
#   5) docker compose up -d
#
# 起動時に init コンテナ (config-init) が envsubst で turnserver.conf を生成し、
# coturn はそれを読んで起動。 heartbeat が60秒ごとに signaling へ自分の派生鍵を送る。
# 5分heartbeatが途絶えれば signaling 側で自動除外。

services:
  # turnserver.conf を env から生成する init container（起動→完了で抜ける）
  config-init:
    image: alpine:3.20
    command:
      - sh
      - -c
      - |
        apk add --no-cache gettext >/dev/null
        envsubst < /template/turnserver.conf.template > /out/turnserver.conf
        echo '=== generated turnserver.conf ==='
        cat /out/turnserver.conf
    environment:
      EXTERNAL_IP: ${EXTERNAL_IP}
      THIS_TURN_AUTH_SECRET: ${THIS_TURN_AUTH_SECRET}
      REALM: ${REALM:-paps.jp}
    volumes:
      - ./turnserver.conf.template:/template/turnserver.conf.template:ro
      - turn-config:/out

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    depends_on:
      config-init:
        condition: service_completed_successfully
    volumes:
      - turn-config:/etc/coturn:ro
    command: ['-c', '/etc/coturn/turnserver.conf']

  # signaling へ 60 秒ごとに「自分は生きている」を通知するサイドカー。
  # curl 一発、起動失敗してもループで自動再試行。
  heartbeat:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      - coturn
    environment:
      SIGNALING_URL: ${SIGNALING_URL:-https://passist.paps.jp}
      TURN_URL: ${TURN_URL}
      THIS_TURN_AUTH_SECRET: ${THIS_TURN_AUTH_SECRET}
      BUDGET_BPS: ${BUDGET_BPS:-4000000}
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null
        while :; do
          if curl -fsS -X POST "$$SIGNALING_URL/admin/turn-register" \
               -H 'Content-Type: application/json' \
               -d "{\"url\":\"$$TURN_URL\",\"secret\":\"$$THIS_TURN_AUTH_SECRET\",\"budgetBps\":$$BUDGET_BPS}" \
               >/dev/null 2>&1; then
            echo "[heartbeat] OK $$TURN_URL"
          else
            echo "[heartbeat] FAILED $$TURN_URL"
          fi
          sleep 60
        done

volumes:
  turn-config:
