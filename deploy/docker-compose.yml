name: passist

# シグナリング(Node) + Caddy(自動TLS+リバプロ) + coturn(TURN中継)
# .env で公開ドメイン・TURNパスワード・帯域上限を指定する。
services:
  signaling:
    # 公開リリースの GHCR image を使用（Reproducible Build + Cosign keyless 署名済）。
    # cosign で検証可能：cosign verify ghcr.io/paps-jp/passist-signaling:${SIGNALING_VERSION}
    # ローカル開発時は build セクションで上書きする (override compose)。
    image: ghcr.io/paps-jp/passist-signaling:${SIGNALING_VERSION:-v0.2.7.4}
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    environment:
      PORT: 8443
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      ACCESS_MODE: ${ACCESS_MODE:-approve}
      SESSION_TTL_MS: ${SESSION_TTL_MS:-1800000}
      # image digest は build 時には未確定なので、pull 後に docker image inspect で取得した値を
      # 起動時に渡して /api/build から公開する。デプロイスクリプトで自動入力可能。
      IMAGE_DIGEST: ${SIGNALING_IMAGE_DIGEST:-}
      # GIT_TAG (= SIGNALING_VERSION) はブラウザ自前検証で Sigstore Bundle URL を組み立てるのに使う
      GIT_TAG: ${SIGNALING_VERSION:-v0.2.7.4}
      # TURN(relay)経由ピアの動的ガバナ。サーバOUT帯域に合わせて配分上限を絞る。
      RELAY_BUDGET_BPS: ${RELAY_BUDGET_BPS:-4000000}
      RELAY_MIN_BPS: ${RELAY_MIN_BPS:-100000}
      RELAY_MAX_BPS: ${RELAY_MAX_BPS:-1500000}
      # viewerへ自動配布する TURN（accepted時に渡る）。signaling は MASTER secret から
      # 接続ごとにラウンドロビンで URL を選び、その URL に対する派生鍵で時限credentialを生成する。
      # 空欄ならホスト側UIの設定のみ有効。
      SIGN_TURN_URLS: ${SIGN_TURN_URLS:-}
      TURN_AUTH_SECRET: ${TURN_AUTH_SECRET:-}
      SIGN_TURN_USERNAME: ${SIGN_TURN_USERNAME:-passist}
      SIGN_TURN_TTL_SEC: ${SIGN_TURN_TTL_SEC:-86400}
    expose:
      - "8443"
    networks:
      - pn

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_SIGNALING: ${DOMAIN_SIGNALING}
      ACME_EMAIL: ${ACME_EMAIL:-paps@paps.jp}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # ACME 証明書（永続化）
      - caddy_config:/config
    networks:
      - pn
    depends_on:
      - signaling

  # TURN は UDP relay レンジ(49152-65535)を扱うため host network で動かす。
  # （Docker のポートマッピングだと大量UDPポートの公開でNAT処理が重く非実用。）
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/turnserver.conf:ro

networks:
  pn:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
